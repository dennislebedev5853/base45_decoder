[project]
name = "base45-decoder"
version = "0.1.1"
description = "Encodes and decodes data using Base45 encoding, a scheme used in European Digital Green Certificates and QR codes."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
